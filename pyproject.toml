[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "program-tracing"
version = "0.1.0"
description = "Run a randomized program once per execution trace, to test it exactly"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = [
    "pytest", "pytest-cov", "pytest-timeout", "coverage", "ruff",
    "scipy", "plotly==5.24.1", "nbformat", "nbconvert", "ipykernel",
]

[tool.setuptools.packages.find]
include = ["program_tracing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.blog]
static = ["images", "widgets"]

[tool.ruff]
extend-exclude = ["docs", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E402", "E701", "E702", "E731"]
