name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Lint
      run: ruff check .

    - name: Run tests with coverage
      run: python -m pytest tests/ -v --cov=program_tracing

    - name: Coverage report
      run: coverage report

  notebook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Execute the article's notebook
      working-directory: content
      run: jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb testing-randomized-algorithms.ipynb
